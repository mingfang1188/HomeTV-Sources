name: Manual source diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check aiohttp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Audit candidate streams
        run: |
          python scripts/audit_streams.py \
            --m3u candidates.m3u \
            --output /tmp/hometv-audit.json \
            --concurrency 8
      - uses: actions/upload-artifact@v4
        with:
          name: hometv-source-diagnostics
          path: |
            /tmp/hometv-audit.json
            /tmp/hometv-audit.tsv
