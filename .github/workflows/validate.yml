name: Validate and publish IPTV sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check aiohttp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Audit candidate streams
        run: |
          python scripts/audit_streams.py \
            --m3u candidates.m3u \
            --output /tmp/hometv-audit.json \
            --concurrency 8
      - name: Publish passing streams
        run: python scripts/publish.py --audit /tmp/hometv-audit.json
      - name: Commit changed source files
        run: |
          git config user.name "HomeTV Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add curated.m3u manifest.json health-report.json health-state.json
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "chore: refresh validated IPTV sources"
            git push
          fi
